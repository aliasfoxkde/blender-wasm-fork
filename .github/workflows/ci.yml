name: ci

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Run setup audit
        run: pnpm audit:setup

      - name: Run artifact audit
        run: pnpm audit:artifacts

      - name: Validate shell script syntax
        run: |
          for f in scripts/*.sh; do bash -n "$f" || exit 1; done
          echo "All shell scripts passed bash -n"

      - name: Install demo dependencies
        run: pnpm install --frozen-lockfile
        working-directory: demo
        env:
          CI: true

      - name: Build demo
        run: pnpm build
        working-directory: demo

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app
        env:
          CI: true

      - name: Typecheck app
        run: pnpm --filter blender-wasm-app typecheck

      - name: Test app
        run: pnpm --filter blender-wasm-app test

      - name: Build app
        run: pnpm --filter blender-wasm-app build
