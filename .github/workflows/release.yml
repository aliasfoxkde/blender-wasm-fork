name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Check artifacts
        id: check
        run: |
          echo "has_cycles=$( [[ -f web/cycles.js ]] && echo true || echo false )" >> $GITHUB_OUTPUT

      - name: Build cycles
        if: steps.check.outputs.has_cycles != 'true'
        run: make cycles-web
        env:
          MAKEFLAGS: "-j$(nproc)"

      - name: Upload to R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
        run: |
          if [[ -n "$R2_BUCKET" ]]; then
            node scripts/sync-assets.mjs
          else
            echo "R2_BUCKET not set — skipping R2 upload"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
          generate_release_notes: true

      - name: Summary
        run: |
          echo "## Release ${{ github.ref }} complete"
          echo "Artifacts uploaded to R2."
          echo "Release: ${{ github.server_url }}/${{ github.repository }}/releases/${{ github.ref }}"
