name: Release

on:
  push:
    tags:
      - "v*"  # e.g. v1.0.0, v2.1.0

# Only one release can run at a time
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Upload Release
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Check existing artifacts
        id: check_artifacts
        run: |
          echo "has_cycles=$( [[ -f web/cycles.js ]] && echo true || echo false )" >> $GITHUB_OUTPUT
          echo "has_blender=$( [[ -f web/blender.wasm ]] && echo true || echo false )" >> $GITHUB_OUTPUT

      # Build cycles only if artifacts don't already exist (builder machine has them pre-built)
      # Standard CI runners don't have the emscripten toolchain — this step is best-effort
      - name: Build cycles artifacts
        if: steps.check_artifacts.outputs.has_cycles != 'true'
        run: |
          if [[ -f web/cycles.js ]]; then
            echo "Cycles artifacts present"
          elif make cycles-web; then
            echo "Cycles build succeeded"
          else
            echo "Cycles build not available — this workflow needs to run on the builder machine with emscripten toolchain"
          fi
        env:
          MAKEFLAGS: "-j$(nproc)"

      - name: Upload artifacts to R2
        if: secrets.R2_BUCKET != ''
        run: node scripts/sync-assets.mjs
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}

      - name: Generate release notes
        id: release-notes
        run: |
          NOTES="## Artifacts

Blender WASM artifacts are hosted on Cloudflare R2.
App syncs artifacts on first load — no git LFS required.

### Included in this release

| File | Size |
|------|------|
"

          for f in web/cycles.js web/cycles.wasm web/cycles.wasm.zst web/cycles.data; do
            if [[ -f $f ]]; then
              SIZE=$(du -h "$f" | cut -f1)
              NOTES+="| $f | $SIZE |"$'\n'
            fi
          done

          NOTES+="
### Cloudflare R2

Artifacts served from: https://blender-wasm-assets.cyopsys.workers.dev

To deploy your own R2 bucket, add these secrets to your repo and run:

\`\`\`bash
export R2_BUCKET=your-bucket R2_ACCOUNT_ID=... R2_ACCESS_KEY=... R2_SECRET_KEY=...
node scripts/sync-assets.mjs
\`\`\`
"
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
          generate_release_notes: false
          body: ${{ steps.release-notes.outputs.notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize
        run: |
          echo "## Release ${{ github.ref }} complete"
          echo ""
          echo "Artifacts uploaded to R2."
          echo "GitHub release created at: ${{ github.server_url }}/${{ github.repository }}/releases/${{ github.ref }}"
